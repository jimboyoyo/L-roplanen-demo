<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartbyggare — LäroPlanen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Century Gothic', CenturyGothic, sans-serif;
    background: #0a0a1a;
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 10px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.8);
  }

  .hint {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
  }

  .canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .canvas-area:active { cursor: grabbing; }

  #canvasSvg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .zoom-controls {
    position: absolute;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 5;
  }

  .zoom-btn {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.8);
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1; transition: background 0.15s;
  }
  .zoom-btn:hover { background: rgba(255,255,255,0.18); }

  .add-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.9);
    font-size: 17px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1; transition: background 0.15s, border-color 0.15s;
  }
  .add-btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.4); }

  .layer-btn {
    height: 28px;
    padding: 0 12px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.9);
    font-family: inherit;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .layer-btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.4); }

  .layers-panel {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 6;
    width: 210px;
    background: rgba(10,10,26,0.85);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    overflow: hidden;
    backdrop-filter: blur(4px);
  }
  .layers-panel-title {
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
    color: rgba(255,255,255,0.4); text-transform: uppercase;
    padding: 10px 12px 8px;
  }
  .layer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
  }
  .layer-row .layer-name { color: rgba(255,255,255,0.85); }
  .layer-row .layer-count { color: rgba(255,255,255,0.35); font-size: 10px; }
  .layer-row .layer-add-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 5px;
    color: rgba(255,255,255,0.85);
    font-family: inherit;
    font-size: 10px; font-weight: 700;
    padding: 3px 8px;
    cursor: pointer;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .layer-row .layer-add-btn:hover { background: rgba(255,255,255,0.22); }
  .layers-empty {
    padding: 4px 12px 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    font-style: italic;
  }

  .layer-ring-guide {
    fill: none;
    stroke: rgba(255,255,255,0.15);
    stroke-width: 1.5;
    stroke-dasharray: 10 8;
  }

  .node-group circle.node-outline {
    fill: rgba(10,10,26,0.65);
    stroke: #fff;
    stroke-width: 2.5;
    cursor: text;
  }

  .group-label {
    fill: #fff;
    font-family: 'Century Gothic', CenturyGothic, sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.06em;
    pointer-events: none;
  }

  .node-slot { cursor: pointer; }
  .node-slot circle.slot-outline {
    fill: rgba(255,255,255,0.04);
    stroke: rgba(255,255,255,0.35);
    stroke-width: 1.5;
    stroke-dasharray: 5 4;
    transition: fill 0.15s, stroke 0.15s;
  }
  .node-slot:hover circle.slot-outline {
    fill: rgba(255,255,255,0.12);
    stroke: rgba(255,255,255,0.7);
  }
  .node-slot .slot-plus {
    fill: rgba(255,255,255,0.35);
    font-size: 22px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    transition: fill 0.15s;
  }
  .node-slot:hover .slot-plus { fill: rgba(255,255,255,0.85); }

  .node-slot.is-filled circle.slot-outline {
    stroke-dasharray: none;
    stroke-width: 2;
  }
  .node-slot.type-project circle.slot-outline { fill: rgba(58,109,240,0.35); stroke: #6f93f5; }
  .node-slot.type-role circle.slot-outline    { fill: rgba(240,168,58,0.35); stroke: #f3bb63; }
  .node-slot .slot-icon {
    font-size: 26px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  .node-slot.is-connecting circle.slot-outline {
    stroke: #4ee08a;
    stroke-width: 2.5;
    stroke-dasharray: 4 3;
    animation: connectPulse 1s ease-in-out infinite;
  }
  @keyframes connectPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.5; }
  }

  .connector-line {
    stroke: rgba(255,255,255,0.4);
    stroke-width: 2.5;
  }
  .connector-hit {
    fill: none;
    stroke: transparent;
    stroke-width: 20;
    cursor: pointer;
  }

  .slot-menu {
    position: absolute;
    display: none;
    flex-direction: column;
    background: #1a1a2e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    overflow: hidden;
    z-index: 50;
    min-width: 160px;
    transform: translate(-50%, -50%);
  }
  .slot-menu.open { display: flex; }
  .slot-menu button {
    background: none;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.85);
    font-family: inherit;
    font-size: 12px;
    text-align: left;
    padding: 10px 14px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .slot-menu button:last-child { border-bottom: none; }
  .slot-menu button:hover { background: rgba(255,255,255,0.1); }

  .label-editor {
    position: absolute;
    display: none;
    z-index: 50;
    transform: translate(-50%, -50%);
  }
  .label-editor.open { display: block; }
  .label-editor input {
    background: #fff;
    border: 2px solid #1a1a2e;
    border-radius: 8px;
    padding: 9px 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #111;
    outline: none;
    width: 200px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .label-editor input::placeholder { color: #bbb; font-weight: 400; }

  .project-editor {
    position: absolute;
    display: none;
    flex-direction: column;
    gap: 10px;
    background: #1a1a2e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 60;
    width: 230px;
    transform: translate(-50%, -50%);
  }
  .project-editor.open { display: flex; }
  .project-editor .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .project-editor label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    color: rgba(255,255,255,0.4); text-transform: uppercase;
  }
  .project-editor input {
    width: 100%;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    color: #111;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.15s;
  }
  .project-editor input:focus { border-color: #3a6df0; }
  .project-editor input::placeholder { color: #bbb; }
  .project-editor textarea {
    width: 100%;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    color: #111;
    outline: none;
    box-sizing: border-box;
    resize: vertical;
    transition: border-color 0.15s;
  }
  .project-editor textarea:focus { border-color: #3a6df0; }
  .project-editor textarea::placeholder { color: #bbb; }
  .project-editor select {
    width: 100%;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    color: #111;
    outline: none;
    box-sizing: border-box;
  }
  .project-editor select:focus { border-color: #3a6df0; }
  .project-editor input[type="color"] {
    width: 100%;
    height: 38px;
    padding: 3px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  .project-editor .editor-error {
    font-size: 11px;
    color: #ff6b6b;
    min-height: 14px;
  }
  .project-editor .editor-submit {
    background: #3a6df0;
    border: none;
    border-radius: 7px;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .project-editor .editor-submit:hover { background: #527af5; }

  .project-picker {
    position: absolute;
    display: none;
    flex-direction: column;
    background: #1a1a2e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 60;
    width: 240px;
    max-height: 280px;
    overflow: hidden;
    transform: translate(-50%, -50%);
  }
  .project-picker.open { display: flex; }
  .picker-filter {
    margin: 12px 12px 8px;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    color: #111;
    outline: none;
    box-sizing: border-box;
  }
  .picker-list {
    overflow-y: auto;
    padding-bottom: 8px;
  }
  .picker-item {
    padding: 9px 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    transition: background 0.15s;
  }
  .picker-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .picker-item .picker-item-id {
    display: block;
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    margin-top: 2px;
  }
  .picker-empty {
    padding: 16px 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    font-style: italic;
    text-align: center;
  }

  .delete-confirm {
    position: absolute;
    display: none;
    flex-direction: column;
    gap: 12px;
    background: #1a1a2e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 60;
    width: 220px;
    transform: translate(-50%, -50%);
  }
  .delete-confirm.open { display: flex; }
  .delete-confirm-text {
    font-size: 12px;
    line-height: 1.5;
    color: rgba(255,255,255,0.8);
  }
  .delete-confirm-actions {
    display: flex;
    gap: 8px;
  }
  .delete-confirm-actions button {
    flex: 1;
    border: none;
    border-radius: 7px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 9px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .delete-confirm-cancel {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.85);
  }
  .delete-confirm-cancel:hover { background: rgba(255,255,255,0.2); }
  .delete-confirm-ok {
    background: #e74c3c;
    color: #fff;
  }
  .delete-confirm-ok:hover { background: #f0665a; }

  .project-card {
    fill: #3a6df0;
    stroke: #6f93f5;
    stroke-width: 2;
    transition: fill 0.15s;
  }
  .node-slot:hover .project-card { fill: #4a7bf7; }
  .project-card-title {
    fill: #fff;
    font-family: 'Century Gothic', CenturyGothic, sans-serif;
    font-weight: 700;
    font-size: 13px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  .order-control { cursor: pointer; }
  .order-control circle.order-btn-bg {
    fill: rgba(10,10,26,0.75);
    stroke: rgba(255,255,255,0.3);
    stroke-width: 1.5;
    transition: fill 0.15s, stroke 0.15s;
  }
  .order-control:hover circle.order-btn-bg {
    fill: rgba(255,255,255,0.18);
    stroke: rgba(255,255,255,0.65);
  }
  .order-control text.order-btn-icon {
    fill: rgba(255,255,255,0.75);
    font-size: 18px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    transition: fill 0.15s;
  }
  .order-control:hover text.order-btn-icon { fill: #fff; }
  .order-control.disabled { cursor: default; pointer-events: none; }
  .order-control.disabled circle.order-btn-bg { fill: rgba(10,10,26,0.75); stroke: rgba(255,255,255,0.12); }
  .order-control.disabled text.order-btn-icon { fill: rgba(255,255,255,0.25); }

  .delete-btn { cursor: pointer; }
  .delete-btn circle.delete-btn-bg {
    fill: rgba(10,10,26,0.9);
    stroke: rgba(255,255,255,0.4);
    stroke-width: 1.5;
    transition: fill 0.15s, stroke 0.15s;
  }
  .delete-btn:hover circle.delete-btn-bg {
    fill: #e74c3c;
    stroke: #e74c3c;
  }
  .delete-btn text.delete-btn-icon {
    fill: rgba(255,255,255,0.8);
    font-size: 14px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    transition: fill 0.15s;
  }
  .delete-btn:hover text.delete-btn-icon { fill: #fff; }

  .area-swatch-btn { cursor: pointer; }
  .area-swatch-btn circle.area-swatch-bg {
    stroke: rgba(255,255,255,0.4);
    stroke-width: 1.5;
    transition: stroke 0.15s;
  }
  .area-swatch-btn:hover circle.area-swatch-bg { stroke: #fff; }

  .zoom-readout {
    position: absolute;
    bottom: 16px;
    left: 16px;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.06em;
    z-index: 5;
    pointer-events: none;
  }

  .preview-layer {
    position: absolute;
    inset: 0;
    z-index: 15;
    background: #0a0a1a;
    display: none;
  }
  .preview-layer.open { display: flex; }
  .preview-svg-host { flex: 1; height: 100%; min-width: 0; }
  .preview-svg-host svg { width: 100%; height: 100%; display: block; }

  .preview-css-panel {
    width: 380px;
    flex-shrink: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #12121f;
    border-left: 1px solid rgba(255,255,255,0.1);
  }
  .preview-css-panel-title {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.04em;
    line-height: 1.5;
    padding: 14px 16px 10px;
    flex-shrink: 0;
  }
  .preview-css-panel textarea {
    flex: 1;
    width: 100%;
    background: #0a0a1a;
    border: none;
    border-top: 1px solid rgba(255,255,255,0.1);
    color: #d4d4d4;
    font-family: 'SF Mono', Consolas, Monaco, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    padding: 14px 16px;
    outline: none;
    resize: none;
    box-sizing: border-box;
  }

  .preview-info-panel {
    position: absolute;
    left: 20px;
    bottom: 20px;
    z-index: 20;
    display: none;
    flex-direction: column;
    gap: 8px;
    background: #1a1a2e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    width: 260px;
    max-width: calc(100% - 40px);
  }
  .preview-info-panel.open { display: flex; }
  .preview-info-close {
    position: absolute;
    top: 10px; right: 10px;
    background: none; border: none;
    color: rgba(255,255,255,0.4);
    font-size: 18px; cursor: pointer;
    line-height: 1; padding: 0;
  }
  .preview-info-close:hover { color: #fff; }
  .preview-info-title {
    font-size: 15px; font-weight: 700;
    color: #fff; padding-right: 16px;
  }
  .preview-info-description {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    line-height: 1.5;
  }
  .preview-info-link {
    font-size: 12px;
    color: #7fb8ff;
    text-decoration: none;
    font-weight: 700;
  }
  .preview-info-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>KARTBYGGARE</h1>
  <div style="display:flex; align-items:center; gap:14px;">
    <div id="builderToolbar" style="display:flex; align-items:center; gap:14px;">
      <button class="add-btn" onclick="createCentralGroup()" title="Skapa central grupp">+</button>
      <button class="layer-btn" onclick="createLayer()" title="Nytt lager">Nytt lager</button>
      <button class="layer-btn" onclick="openProjectCatalogEditor()" title="Skapa nytt projekt i databasen">+ Projekt</button>
      <button class="layer-btn" onclick="openRoleCatalogEditor()" title="Skapa ny roll i databasen">+ Roll</button>
      <button class="layer-btn" onclick="openAreaCatalogEditor()" title="Skapa nytt område i databasen">+ Område</button>
      <button class="layer-btn" onclick="openMapSaveDialog()" title="Spara kartan till Firebase">Spara karta</button>
      <button class="layer-btn" onclick="openMapLoadPicker()" title="Läs in en sparad karta från Firebase">Läs in karta</button>
    </div>
    <button class="layer-btn" id="previewToggleBtn" onclick="togglePreviewMode()" title="Förhandsgranska kartan">Förhandsgranska</button>
    <span class="hint" id="saveStatus"></span>
    <span class="hint" id="headerHint">Dra för att panorera &nbsp;·&nbsp; Scrolla för att zooma</span>
  </div>
</header>

<div class="canvas-area" id="canvasArea">
  <svg id="canvasSvg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
        <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
      </pattern>
      <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
        <rect width="100" height="100" fill="url(#grid)"/>
        <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.75"/>
      </pattern>
    </defs>
    <rect id="gridBg" fill="url(#gridMajor)" />
    <g id="world">
      <g id="guidesLayer"></g>
      <g id="connectorsLayer"></g>
      <g id="nodesLayer"></g>
    </g>
  </svg>

  <div class="layers-panel" id="layersPanel">
    <div class="layers-panel-title">Lager</div>
    <div class="layer-row">
      <span class="layer-name">Central grupp</span>
      <span class="layer-count" id="coreStatus">Ej skapad</span>
    </div>
    <div id="layersList"></div>
    <div class="layers-empty" id="layersEmpty">Inga lager ännu.</div>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" onclick="zoom(1.2)">+</button>
    <button class="zoom-btn" onclick="zoom(0.8)">−</button>
    <button class="zoom-btn" onclick="resetView()" title="Återställ vy" style="font-size:12px;">↺</button>
  </div>

  <div class="zoom-readout" id="zoomReadout">100%</div>

  <div class="preview-layer" id="previewLayer">
    <div class="preview-svg-host" id="previewSvgHost"></div>
    <div class="preview-info-panel" id="previewInfoPanel">
      <button class="preview-info-close" onclick="closePreviewInfoPanel()">×</button>
      <div class="preview-info-title" id="previewInfoTitle"></div>
      <div class="preview-info-description" id="previewInfoDescription"></div>
      <a class="preview-info-link" id="previewInfoLink" href="#" target="_blank" rel="noopener noreferrer">Öppna länk ↗</a>
    </div>
    <div class="preview-css-panel">

<script>
// ─── VIEWBOX STATE ──────────────────────────────────────────────────────────
// The world is laid out in a fixed coordinate space (SVG units == grid units,
// 10 units per small grid cell). vx/vy/vw/vh describe the visible viewBox.

let vx = 0, vy = 0, vw = 2000, vh = 1200;
const BASE_W = 2000, BASE_H = 1200; // "100% zoom" reference size
const MIN_VW = 200;                 // most zoomed-in (10x)
const MAX_VW = 8000;                // most zoomed-out (0.25x)

const svg = document.getElementById('canvasSvg');
const gridBg = document.getElementById('gridBg');
const area = document.getElementById('canvasArea');
const zoomReadout = document.getElementById('zoomReadout');

function applyViewBox() {
  svg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);
  // Keep the grid background covering the full visible area generously,
  // so panning never reveals an edge.
  const pad = Math.max(vw, vh) * 4;
  gridBg.setAttribute('x', vx - pad);
  gridBg.setAttribute('y', vy - pad);
  gridBg.setAttribute('width', vw + pad * 2);
  gridBg.setAttribute('height', vh + pad * 2);
  zoomReadout.textContent = Math.round((BASE_W / vw) * 100) + '%';
}

function resetView() {
  vx = 0; vy = 0; vw = BASE_W; vh = BASE_H;
  applyViewBox();
}

function zoom(factor, cx, cy) {
  if (cx === undefined) cx = area.clientWidth / 2;
  if (cy === undefined) cy = area.clientHeight / 2;
  const rect = svg.getBoundingClientRect();
  const svgX = vx + (cx - rect.left) / rect.width  * vw;
  const svgY = vy + (cy - rect.top)  / rect.height * vh;
  const newW = Math.min(MAX_VW, Math.max(MIN_VW, vw * (1 / factor)));
  const newH = newW * (vh / vw);
  const f = newW / vw;
  vx = svgX - (svgX - vx) * f;
  vy = svgY - (svgY - vy) * f;
  vw = newW; vh = newH;
  applyViewBox();
}

// ─── PAN (mouse) ────────────────────────────────────────────────────────────

let dragging = false, sx, sy, svx, svy;

area.addEventListener('mousedown', e => {
  if (previewOpen) return;
  if (e.target.closest('.zoom-btn') || e.target.closest('.add-btn') || e.target.closest('.node-slot') || e.target.closest('.slot-menu') || e.target.closest('.layers-panel') || e.target.closest('.label-editor') || e.target.closest('.project-editor') || e.target.closest('.project-picker') || e.target.closest('.delete-confirm') || e.target.closest('.order-control') || e.target.classList.contains('node-outline')) return;
  dragging = true;
  sx = e.clientX; sy = e.clientY;
  svx = vx; svy = vy;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const rect = svg.getBoundingClientRect();
  const dx = (e.clientX - sx) / rect.width  * vw;
  const dy = (e.clientY - sy) / rect.height * vh;
  vx = svx - dx; vy = svy - dy;
  applyViewBox();
});
window.addEventListener('mouseup', () => dragging = false);

area.addEventListener('wheel', e => {
  if (previewOpen) return;
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.1 : 0.9, e.clientX, e.clientY);
}, { passive: false });

// ─── PAN + PINCH ZOOM (touch) ───────────────────────────────────────────────

let lastTouches = null;
area.addEventListener('touchstart', e => { if (previewOpen) return; e.preventDefault(); lastTouches = e.touches; }, { passive: false });
area.addEventListener('touchmove', e => {
  if (previewOpen) return;
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const touches = e.touches;
  if (touches.length === 1 && lastTouches?.length === 1) {
    const dx = (touches[0].clientX - lastTouches[0].clientX) / rect.width  * vw;
    const dy = (touches[0].clientY - lastTouches[0].clientY) / rect.height * vh;
    vx -= dx; vy -= dy; applyViewBox();
  } else if (touches.length === 2 && lastTouches?.length === 2) {
    const prevDist = Math.hypot(lastTouches[0].clientX - lastTouches[1].clientX, lastTouches[0].clientY - lastTouches[1].clientY);
    const newDist  = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    if (prevDist === 0) return;
    const midX = (touches[0].clientX + touches[1].clientX) / 2;
    const midY = (touches[0].clientY + touches[1].clientY) / 2;
    zoom(newDist / prevDist, midX, midY);
  }
  lastTouches = touches;
}, { passive: false });
area.addEventListener('touchend', e => { if (previewOpen) return; lastTouches = e.touches.length > 0 ? e.touches : null; }, { passive: false });

// ─── GROUP NODES ────────────────────────────────────────────────────────────
// A "group" is an outlined circle placed on the map, with 9 node slots:
// one centered, eight spaced evenly around the outline. Each slot is either
// empty (shows a "+") or filled with a project/role node.

const svgNS = 'http://www.w3.org/2000/svg';
const guidesLayer = document.getElementById('guidesLayer');
const nodesLayer = document.getElementById('nodesLayer');
const connectorsLayer = document.getElementById('connectorsLayer');
const slotMenu = document.getElementById('slotMenu');

const GROUP_RADIUS = 250; // world units — 500px standard diameter
const SLOT_RADIUS   = 32; // size of each node placeholder
const SLOT_COUNT    = 8;  // evenly spaced around the outline (+1 in the center)

// Fixed anchor the whole map is built around — independent of pan/zoom,
// so rings stay concentric no matter where the user has scrolled to.
const MAP_CENTER = { x: BASE_W / 2, y: BASE_H / 2 };

const TYPE_ICON = { project: '📁', role: '🎭' };

// How much of the ring's circumference (in degrees) gets reserved at the
// top for a label, so outline slots nudge out of its way.
const LABEL_GAP_DEGREES = 55;
const LABEL_RADIUS_OFFSET = SLOT_RADIUS + 20; // how far outside the ring the label sits

const svgDefs = document.querySelector('#canvasSvg defs');

// ─── FIREBASE (project catalog) ─────────────────────────────────────────────
// Same Firebase project as the main LäroPlanen app — projects created here
// live at /mapProjects/{id} and are the shared source of truth for title/url.
// Nodes on the map only ever store a reference (the id); the title shown
// on a node is looked up from this catalog live, so editing a project here
// updates it everywhere it's placed.

const firebaseConfig = {
  apiKey: "AIzaSyBmTngmHOQZ8Szv2I7o-zzqMfebQQvybx8",
  authDomain: "laroplanen-help.firebaseapp.com",
  databaseURL: "https://laroplanen-help-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "laroplanen-help",
  storageBucket: "laroplanen-help.firebasestorage.app",
  messagingSenderId: "895065825769",
  appId: "1:895065825769:web:2e519fa850e24f9a2b6b78"
};

let projectDb = null;
let projectCatalog = {}; // id -> { title, url, id, area }
let roleCatalog = {};    // id -> { id, title, description, url, area }
let mapCatalog = {};     // key -> { name, svg, savedAt }
let areaCatalog = {};    // id -> { id, name, color }
let currentMapKey = null;  // the map currently loaded/being worked on, if any
let currentMapName = '';

(function initFirebaseProjects() {
  const script1 = document.createElement('script');
  script1.src = 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js';
  script1.onload = () => {

        onRoleCatalogUpdated();
      });
      projectDb.ref('maps').on('value', snapshot => {

        if (mapLoadPickerOpen) renderMapLoadPickerList(mapLoadPickerFilter.value);
      });
      projectDb.ref('mapAreas').on('value', snapshot => {

// Keeps already-placed nodes and an open picker in sync whenever the
// database changes (a title edited elsewhere, a new project added, etc).
function onProjectCatalogUpdated() {
  Object.values(groups).forEach(group => {
    group.slots.forEach(slot => {
      if (slot.type === 'project') renderSlot(group.id, slot);
    });
  });
  if (projectPickerTarget) renderProjectPickerList(projectPickerFilter.value);
}

function onRoleCatalogUpdated() {
  Object.values(groups).forEach(group => {
    group.slots.forEach(slot => {
      if (slot.type === 'role') renderSlot(group.id, slot);
    });
  });
  if (rolePickerTarget) renderRolePickerList(rolePickerFilter.value);
}

// Area colors affect groups, project cards, and role circles alike, so a
// catalog change needs to ripple through all three.
function onAreaCatalogUpdated() {
  updateAreaSelectOptions();
  Object.keys(groups).forEach(id => applyGroupOutlineStyle(id));
  Object.values(groups).forEach(group => {
    group.slots.forEach(slot => {
      if (slot.type === 'project' || slot.type === 'role') renderSlot(group.id, slot);
    });
  });
  if (areaPickerTarget !== null) renderAreaPickerList(areaPickerFilter.value);
}

function updateAreaSelectOptions() {
  [document.getElementById('projectAreaSelect'), document.getElementById('roleAreaSelect')].forEach(select => {
    const current = select.value;
    select.innerHTML = '<option value="">Inget område</option>';
    Object.values(areaCatalog).forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.name;
      select.appendChild(opt);
    });
    if (areaCatalog[current]) select.value = current;
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let groups = {};        // id -> group record
let groupIdCounter = 1;
let connections = [];   // { id, from: {groupId, slotIndex}, to: {groupId, slotIndex}, el }
let connectionIdCounter = 1;
let connectingFrom = null; // { groupId, slotIndex } while in "create connection" mode
let menuTarget = null;     // { groupId, slotIndex } while the submenu is open

let centralGroupId = null;
let layers = [];        // { id, index, radius, groupIds: [] }
let layerIdCounter = 1;

// Creates a group's DOM + data record at a given position and registers it.
function createGroupAt(cx, cy, forcedId = null) {
  const id = forcedId || ('group-' + groupIdCounter++);

  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('class', 'node-group');
  g.setAttribute('data-id', id);

  const circle = document.createElementNS(svgNS, 'circle');
  circle.setAttribute('class', 'node-outline');
  circle.setAttribute('cx', cx);
  circle.setAttribute('cy', cy);
  circle.setAttribute('r', GROUP_RADIUS);
  circle.addEventListener('click', e => {
    e.stopPropagation();
    openGroupLabelEditor(id);
  });
  g.appendChild(circle);

  const orderControlsEl = document.createElementNS(svgNS, 'g');
  orderControlsEl.setAttribute('class', 'order-controls');
  g.appendChild(orderControlsEl);

  const scaleControlsEl = document.createElementNS(svgNS, 'g');
  scaleControlsEl.setAttribute('class', 'scale-controls');
  g.appendChild(scaleControlsEl);

  const labelRotateControlsEl = document.createElementNS(svgNS, 'g');
  labelRotateControlsEl.setAttribute('class', 'label-rotate-controls');
  g.appendChild(labelRotateControlsEl);

  const deleteControlEl = document.createElementNS(svgNS, 'g');
  deleteControlEl.setAttribute('class', 'group-delete-control');
  g.appendChild(deleteControlEl);

  const areaControlEl = document.createElementNS(svgNS, 'g');
  areaControlEl.setAttribute('class', 'area-control');
  g.appendChild(areaControlEl);

  groups[id] = { id, cx, cy, r: GROUP_RADIUS, slots: [], el: g, circleEl: circle, label: '', labelAngle: -Math.PI / 2, layerId: null, areaId: null, orderControlsEl, scaleControlsEl, labelRotateControlsEl, deleteControlEl, areaControlEl, slotAngleOrder: [1, 2, 3, 4, 5, 6, 7, 8] };

  const positions = buildSlotPositions(cx, cy, GROUP_RADIUS, 0);
  const slots = positions.map((pos, i) => {
    const slotEl = document.createElementNS(svgNS, 'g');
    slotEl.setAttribute('data-group', id);
    slotEl.setAttribute('data-slot-index', i);
    slotEl.addEventListener('click', e => {
      e.stopPropagation();
      onSlotClick(id, i);
    });
    g.appendChild(slotEl);
    return { index: i, x: pos.x, y: pos.y, isCenter: pos.isCenter, type: null, el: slotEl };
  });
  groups[id].slots = slots;

  nodesLayer.appendChild(g);

  applyGroupLayout(id);

  return id;
}

// Recomputes and re-renders everything derived from a group's current
// state (cx, cy, r, label, labelAngle, slotAngleOrder): the circle, the 9
// slots (in whatever order slotAngleOrder currently specifies), the label
// arc, the order/scale/label-rotate controls, and any attached connections.
// This is the single place all of those get recalculated, so a custom node
// order set via moveNodeOnRing survives later scaling/rotating/moving.
function applyGroupLayout(groupId) {
  const group = groups[groupId];
  if (!group) return;

  group.circleEl.setAttribute('cx', group.cx);
  group.circleEl.setAttribute('cy', group.cy);
  group.circleEl.setAttribute('r', group.r);

  const gapRad = getLabelGapRadians(group);
  const positions = buildSlotPositions(group.cx, group.cy, group.r, gapRad, group.labelAngle);

  const centerSlot = group.slots[0];
  centerSlot.x = positions[0].x;
  centerSlot.y = positions[0].y;
  renderSlot(groupId, centerSlot);

  // Outline slots: position k on the ring is occupied by whichever stable
  // slot index slotAngleOrder[k] currently points to.
  group.slotAngleOrder.forEach((stableIndex, k) => {
    const pos = positions[k + 1];
    const slot = group.slots[stableIndex];
    slot.x = pos.x;
    slot.y = pos.y;
    renderSlot(groupId, slot);
  });

  if (group.labelPathEl) updateGroupLabelPath(groupId);
  updateGroupOrderControls(groupId);
  updateGroupScaleControls(groupId);
  updateGroupLabelRotateControls(groupId);
  updateGroupDeleteControl(groupId);
  updateGroupAreaControl(groupId);
  applyGroupOutlineStyle(groupId);

  syncConnectionsForGroup(groupId);
}

function syncConnectionsForGroup(groupId) {
  connections.forEach(conn => {
    if (conn.from.groupId === groupId) {
      const s = getSlot(conn.from.groupId, conn.from.slotIndex);
      conn.hitLineEl.setAttribute('x1', s.x);
      conn.hitLineEl.setAttribute('y1', s.y);
      conn.visLineEl.setAttribute('x1', s.x);
      conn.visLineEl.setAttribute('y1', s.y);
    }
    if (conn.to.groupId === groupId) {
      const s = getSlot(conn.to.groupId, conn.to.slotIndex);
      conn.hitLineEl.setAttribute('x2', s.x);
      conn.hitLineEl.setAttribute('y2', s.y);
      conn.visLineEl.setAttribute('x2', s.x);
      conn.visLineEl.setAttribute('y2', s.y);
    }
  });
}

// Repositions an existing group (used when a ring is redistributed) and
// keeps its slots and any attached connector lines in sync.
function moveGroupTo(groupId, cx, cy) {
  const group = groups[groupId];
  if (!group) return;
  group.cx = cx; group.cy = cy;
  applyGroupLayout(groupId);
}

// Swaps a node one step clockwise/counter-clockwise around its group's
// outline, keeping its type and any connections attached to it. The center
// slot has no order (there's only one), so it's a no-op there.
function moveNodeOnRing(groupId, slotIndex, direction) {
  const group = groups[groupId];
  if (!group || slotIndex === 0) return;
  const k = group.slotAngleOrder.indexOf(slotIndex);
  if (k === -1) return;
  const targetK = (k + direction + SLOT_COUNT) % SLOT_COUNT;
  [group.slotAngleOrder[k], group.slotAngleOrder[targetK]] =
    [group.slotAngleOrder[targetK], group.slotAngleOrder[k]];
  applyGroupLayout(groupId);
}

// ─── CENTRAL GROUP ──────────────────────────────────────────────────────────

function createCentralGroup() {
  if (centralGroupId) {
    console.log('Central group already exists.');
    return;
  }
  centralGroupId = createGroupAt(MAP_CENTER.x, MAP_CENTER.y);
  document.getElementById('coreStatus').textContent = 'Skapad';
}

// ─── LAYERS / RINGS ─────────────────────────────────────────────────────────

const RING_SPACING = 700; // world units between consecutive ring radii

function createLayer() {
  const index = layers.length + 1;
  const radius = RING_SPACING * index;
  const id = 'layer-' + layerIdCounter++;
  const layer = { id, index, radius, groupIds: [] };
  layers.push(layer);

  const guide = document.createElementNS(svgNS, 'circle');
  guide.setAttribute('class', 'layer-ring-guide');
  guide.setAttribute('cx', MAP_CENTER.x);
  guide.setAttribute('cy', MAP_CENTER.y);
  guide.setAttribute('r', radius);
  guidesLayer.appendChild(guide);
  layer.guideEl = guide;

  renderLayersPanel();
  return id;
}

function addGroupToLayer(layerId) {
  const layer = layers.find(l => l.id === layerId);
  if (!layer) return;
  const groupId = createGroupAt(MAP_CENTER.x + layer.radius, MAP_CENTER.y);
  groups[groupId].layerId = layerId;
  layer.groupIds.push(groupId);
  redistributeLayer(layer);
  renderLayersPanel();
}

// ─── RING ORDERING (clockwise / counter-clockwise) ─────────────────────────

function moveGroupOnRing(groupId, direction) {
  const group = groups[groupId];
  if (!group || !group.layerId) return;
  const layer = layers.find(l => l.id === group.layerId);
  if (!layer) return;
  const count = layer.groupIds.length;
  if (count < 2) return;

  const idx = layer.groupIds.indexOf(groupId);
  if (idx === -1) return;
  const targetIdx = (idx + direction + count) % count;

  [layer.groupIds[idx], layer.groupIds[targetIdx]] = [layer.groupIds[targetIdx], layer.groupIds[idx]];
  redistributeLayer(layer);
}

// Builds/refreshes the pair of rotate arrows below a group. Hidden for the
// central group and for rings that only have one group on them.
const ORDER_BTN_RADIUS = 18;
const ORDER_BTN_OFFSET_X = 40;
const ORDER_BTN_OFFSET_Y = 40;

// Small reorder arrows on each individual outline node (smaller than the
// group-level ones, since they sit right under a 32-unit-radius slot).
const NODE_ORDER_BTN_RADIUS = 12;
const NODE_ORDER_BTN_OFFSET_X = 16;
const NODE_ORDER_BTN_GAP = 16; // gap between a node's edge and its reorder arrows

const PROJECT_RECT_WIDTH = 130;
const PROJECT_RECT_HEIGHT = 56;
const PROJECT_RECT_RX = 14;

function updateGroupOrderControls(groupId) {
  const group = groups[groupId];
  if (!group) return;
  const container = group.orderControlsEl;
  container.innerHTML = '';

  if (!group.layerId) return;
  const layer = layers.find(l => l.id === group.layerId);
  if (!layer || layer.groupIds.length < 2) return;

  const y = group.cy + group.r + ORDER_BTN_OFFSET_Y;
  container.appendChild(createOrderBtn(group.cx - ORDER_BTN_OFFSET_X, y, '↺', () => moveGroupOnRing(groupId, -1)));
  container.appendChild(createOrderBtn(group.cx + ORDER_BTN_OFFSET_X, y, '↻', () => moveGroupOnRing(groupId, 1)));
}

function createOrderBtn(x, y, glyph, onClick, disabled = false, radius = ORDER_BTN_RADIUS, fontSize = 18) {
  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('class', 'order-control' + (disabled ? ' disabled' : ''));

  const circle = document.createElementNS(svgNS, 'circle');
  circle.setAttribute('class', 'order-btn-bg');
  circle.setAttribute('cx', x);
  circle.setAttribute('cy', y);
  circle.setAttribute('r', radius);
  g.appendChild(circle);

  const text = document.createElementNS(svgNS, 'text');
  text.setAttribute('class', 'order-btn-icon');
  text.setAttribute('x', x);
  text.setAttribute('y', y);
  text.style.fontSize = fontSize + 'px';
  text.textContent = glyph;
  g.appendChild(text);

  if (!disabled) {
    g.addEventListener('click', e => {
      e.stopPropagation();
      onClick();
    });
  }

  return g;
}

const DELETE_BTN_RADIUS = 11;

function createDeleteBtn(x, y, onClick) {
  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('class', 'delete-btn');

  const circle = document.createElementNS(svgNS, 'circle');
  circle.setAttribute('class', 'delete-btn-bg');
  circle.setAttribute('cx', x);
  circle.setAttribute('cy', y);
  circle.setAttribute('r', DELETE_BTN_RADIUS);
  g.appendChild(circle);

  const text = document.createElementNS(svgNS, 'text');
  text.setAttribute('class', 'delete-btn-icon');
  text.setAttribute('x', x);
  text.setAttribute('y', y);
  text.textContent = '×';
  g.appendChild(text);

  g.addEventListener('click', e => {
    e.stopPropagation();
    onClick();
  });

  return g;
}

// Shared in-canvas confirmation popup for destructive actions (deleting a
// node or a whole group). Used instead of window.confirm(), since native
// dialogs get silently blocked in some sandboxed preview environments.
const deleteConfirm = document.getElementById('deleteConfirm');
const deleteConfirmText = document.getElementById('deleteConfirmText');
let deleteConfirmTarget = null; // { type: 'node'|'group', groupId, slotIndex? }

function openDeleteConfirmAt(worldX, worldY, message, target) {
  closeSlotMenu();
  cancelConnection();
  cancelGroupLabelEditor();
  cancelProjectCatalogEditor();
  closeProjectPicker();
  cancelRoleCatalogEditor();
  closeRolePicker();
  cancelAreaCatalogEditor();
  closeAreaPicker();
  cancelMapSaveDialog();
  closeMapLoadPicker();

  deleteConfirmTarget = target;
  deleteConfirmText.textContent = message;
  document.getElementById('deleteConfirmOkBtn').textContent = 'Ta bort';
  const pos = worldToScreen(worldX, worldY);
  deleteConfirm.style.left = pos.x + 'px';
  deleteConfirm.style.top = pos.y + 'px';
  deleteConfirm.classList.add('open');
}

function cancelDeleteConfirm() {
  deleteConfirmTarget = null;
  deleteConfirm.classList.remove('open');
}

function confirmDelete() {
  if (!deleteConfirmTarget) return;
  const target = deleteConfirmTarget;
  cancelDeleteConfirm();

  if (target.type === 'node') {
    performDeleteNode(target.groupId, target.slotIndex);
  } else if (target.type === 'group') {
    performDeleteGroup(target.groupId);
  } else if (target.type === 'loadMap') {
    performSelectedMapLoad();
  }
}

// ─── DELETE NODE ────────────────────────────────────────────────────────────

function requestDeleteNode(groupId, slotIndex) {
  const slot = getSlot(groupId, slotIndex);
  if (!slot || !slot.type) return;
  const message = (slot.type === 'project' || slot.type === 'role')
    ? 'Ta bort noden från kartan? Länken tas bort, men posten finns kvar i databasen. Eventuella linjer till den tas också bort.'
    : 'Ta bort noden? Eventuella kopplingar till den tas också bort.';
  openDeleteConfirmAt(slot.x, slot.y, message, { type: 'node', groupId, slotIndex });
}

// Clears a filled node back to empty, and removes any connections attached
// to it (a dangling connection pointing at an empty "+" wouldn't make sense).
function performDeleteNode(groupId, slotIndex) {
  const slot = getSlot(groupId, slotIndex);
  if (!slot || !slot.type) return;

  connections = connections.filter(conn => {
    const touchesThisSlot =
      (conn.from.groupId === groupId && conn.from.slotIndex === slotIndex) ||
      (conn.to.groupId === groupId && conn.to.slotIndex === slotIndex);
    if (touchesThisSlot) conn.el.remove();
    return !touchesThisSlot;
  });

  slot.type = null;
  slot.projectId = undefined;
  slot.roleId = undefined;
  renderSlot(groupId, slot);
}

// ─── DELETE GROUP ───────────────────────────────────────────────────────────

function requestDeleteGroup(groupId) {
  const group = groups[groupId];
  if (!group) return;
  openDeleteConfirmAt(
    group.cx, group.cy,
    'Ta bort gruppen? Alla noder och kopplingar i den tas också bort.',
    { type: 'group', groupId }
  );
}

// Removes a group entirely: its DOM, its label path (lives in <defs>, so
// not a child of the group), any connections touching any of its slots,
// its spot on a ring (redistributing whatever's left on that ring), and —
// if it was the central group — resets that tracking so "+" works again.
function performDeleteGroup(groupId) {
  const group = groups[groupId];
  if (!group) return;

  connections = connections.filter(conn => {
    const touchesThisGroup = conn.from.groupId === groupId || conn.to.groupId === groupId;
    if (touchesThisGroup) conn.el.remove();
    return !touchesThisGroup;
  });

  if (group.labelPathEl) group.labelPathEl.remove();
  group.el.remove();

  if (group.layerId) {
    const layer = layers.find(l => l.id === group.layerId);
    if (layer) {
      layer.groupIds = layer.groupIds.filter(id => id !== groupId);
      redistributeLayer(layer);
      renderLayersPanel();
    }
  }

  if (centralGroupId === groupId) {
    centralGroupId = null;
    document.getElementById('coreStatus').textContent = 'Ej skapad';
  }

  delete groups[groupId];
}

// ─── EXPORT / SAVE ──────────────────────────────────────────────────────────
// Serializes the current map into one real, deployable SVG file. Only real
// content is written out (group circles, labels, filled nodes, connector
// lines) — none of the builder's own chrome (arrows, +/− buttons, empty "+"
// placeholders). Round-trip metadata (ring membership, label angle, node
// order) rides along as data-* attributes the live app simply ignores.

const EXPORT_MARGIN = 200; // world units of padding around the map's bounding box

function exportMapToSvgString() {
  const groupList = Object.values(groups);

  // Bounding box across every group's circle, so nothing gets clipped.
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  groupList.forEach(g => {
    minX = Math.min(minX, g.cx - g.r);
    minY = Math.min(minY, g.cy - g.r);
    maxX = Math.max(maxX, g.cx + g.r);
    maxY = Math.max(maxY, g.cy + g.r);
  });
  if (!groupList.length) { minX = 0; minY = 0; maxX = BASE_W; maxY = BASE_H; }
  const vbX = minX - EXPORT_MARGIN, vbY = minY - EXPORT_MARGIN;
  const vbW = (maxX - minX) + EXPORT_MARGIN * 2, vbH = (maxY - minY) + EXPORT_MARGIN * 2;

  let defs = '';
  let groupsMarkup = '';
  let nodesMarkup = '';
  let connectorsMarkup = '';

  groupList.forEach(group => {
    const gapRad = getLabelGapRadians(group);
    const labelAngle = group.labelAngle ?? -Math.PI / 2;

    // Group circle (decorative in the live app; data-* is builder-only).
    const layer = group.layerId ? layers.find(l => l.id === group.layerId) : null;
    const groupArea = group.areaId ? areaCatalog[group.areaId] : null;
    const groupStroke = groupArea ? groupArea.color : '#fff';
    const groupAreaClass = group.areaId ? ` area-${escapeHtml(group.areaId)}` : '';
    groupsMarkup += `<circle class="map-group-outline${groupAreaClass}" cx="${group.cx}" cy="${group.cy}" r="${group.r}" `
      + `fill="rgba(10,10,26,0.65)" stroke="${groupStroke}" stroke-width="${GROUP_OUTLINE_WIDTH}" `
      + `data-role="group" data-group-id="${escapeHtml(group.id)}" `
      + `data-label="${escapeHtml(group.label || '')}" data-label-angle="${labelAngle}" `
      + `data-layer-id="${escapeHtml(group.layerId || '')}" data-layer-index="${layer ? layer.index : ''}" `
      + `data-area-id="${escapeHtml(group.areaId || '')}" `
      + `data-slot-order="${group.slotAngleOrder.join(',')}" />\n`;

    // Curved label, if any — same top-of-ring arc technique as the builder.
    if (group.label) {
      const pathId = `export-label-path-${group.id}`;
      const r = group.r + LABEL_RADIUS_OFFSET;
      const startAngle = labelAngle - Math.PI / 2;
      const endAngle = labelAngle + Math.PI / 2;
      const p1x = group.cx + r * Math.cos(startAngle), p1y = group.cy + r * Math.sin(startAngle);
      const p2x = group.cx + r * Math.cos(endAngle), p2y = group.cy + r * Math.sin(endAngle);
      defs += `<path id="${pathId}" fill="none" d="M ${p1x} ${p1y} A ${r} ${r} 0 0 1 ${p2x} ${p2y}" />\n`;
      groupsMarkup += `<text class="map-group-label" font-family="Century Gothic, sans-serif" font-weight="700" font-size="30" fill="#fff" letter-spacing="0.06em">`
        + `<textPath href="#${pathId}" startOffset="50%" text-anchor="middle">${escapeHtml(group.label)}</textPath></text>\n`;
    }

    // Filled nodes only — empty "+" placeholders never get exported.
    group.slots.forEach(slot => {
      if (!slot.type) return;

      if (slot.type === 'project') {
        const project = projectCatalog[slot.projectId];
        const title = project ? project.title : '';
        const url = project ? project.url : '';
        const projectArea = project && project.area ? areaCatalog[project.area] : null;
        const projectFill = projectArea ? projectArea.color : '#3a6df0';
        const projectAreaClass = project && project.area ? ` area-${escapeHtml(project.area)}` : '';
        const nodeId = `project-${slot.projectId}`;
        const rectX = slot.x - PROJECT_RECT_WIDTH / 2, rectY = slot.y - PROJECT_RECT_HEIGHT / 2;
        const rectMarkup = `<rect id="${escapeHtml(nodeId)}" class="map-project-card${projectAreaClass}" x="${rectX}" y="${rectY}" width="${PROJECT_RECT_WIDTH}" height="${PROJECT_RECT_HEIGHT}" `
          + `rx="${PROJECT_RECT_RX}" fill="${projectFill}" stroke="#6f93f5" stroke-width="2" `
          + `data-role="node" data-group-id="${escapeHtml(group.id)}" data-slot-index="${slot.index}" />\n`
          + `<text class="map-project-title${projectAreaClass}" x="${slot.x}" y="${slot.y}" font-family="Century Gothic, sans-serif" font-weight="700" font-size="13" fill="#fff" `
          + `text-anchor="middle" dominant-baseline="central" pointer-events="none">${escapeHtml(title)}</text>\n`;
        nodesMarkup += url
          ? `<a data-url="${escapeHtml(url)}">${rectMarkup}</a>\n`
          : rectMarkup;
      } else if (slot.type === 'role') {
        const role = roleCatalog[slot.roleId];
        const url = role ? role.url : '';
        const roleArea = role && role.area ? areaCatalog[role.area] : null;
        const roleFill = roleArea ? roleArea.color : 'rgba(240,168,58,0.35)';
        const roleFillOpacity = roleArea ? ' fill-opacity="0.35"' : '';
        const roleAreaClass = role && role.area ? ` area-${escapeHtml(role.area)}` : '';
        const nodeId = `role-${slot.roleId}`;
        const circleMarkup = `<circle id="${escapeHtml(nodeId)}" class="map-role${roleAreaClass}" cx="${slot.x}" cy="${slot.y}" r="${SLOT_RADIUS}" `
          + `fill="${roleFill}"${roleFillOpacity} stroke="#f3bb63" stroke-width="2" `
          + `data-role="node" data-group-id="${escapeHtml(group.id)}" data-slot-index="${slot.index}" />\n`
          + `<text class="map-role-icon${roleAreaClass}" x="${slot.x}" y="${slot.y}" font-size="26" text-anchor="middle" dominant-baseline="central" pointer-events="none">${TYPE_ICON.role}</text>\n`;
        nodesMarkup += url
          ? `<a data-url="${escapeHtml(url)}">${circleMarkup}</a>\n`
          : circleMarkup;
      }
    });
  });

  connections.forEach(conn => {
    const fromSlot = getSlot(conn.from.groupId, conn.from.slotIndex);
    const toSlot = getSlot(conn.to.groupId, conn.to.slotIndex);
    if (!fromSlot || !toSlot) return;
    const connArea = conn.areaId ? areaCatalog[conn.areaId] : null;
    const connStroke = connArea ? connArea.color : 'rgba(255,255,255,0.4)';
    const connAreaClass = conn.areaId ? ` area-${escapeHtml(conn.areaId)}` : '';
    connectorsMarkup += `<line class="connector${connAreaClass}" x1="${fromSlot.x}" y1="${fromSlot.y}" x2="${toSlot.x}" y2="${toSlot.y}" `
      + `stroke="${connStroke}" stroke-width="${CONNECTOR_WIDTH}" `
      + `data-from-group="${escapeHtml(conn.from.groupId)}" data-from-slot="${conn.from.slotIndex}" `
      + `data-to-group="${escapeHtml(conn.to.groupId)}" data-to-slot="${conn.to.slotIndex}" `
      + `data-area-id="${escapeHtml(conn.areaId || '')}" />\n`;
  });

  return `<?xml version="1.0" encoding="UTF-8"?>\n`
    + `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" `
    + `viewBox="${vbX} ${vbY} ${vbW} ${vbH}">\n`
    + `<defs>\n${defs}</defs>\n`
    + `<g id="connector-layer">\n${connectorsMarkup}</g>\n`
    + `<g id="group-layer">\n${groupsMarkup}</g>\n`
    + `<g id="node-layer">\n${nodesMarkup}</g>\n`
    + `</svg>\n`;
}

// ─── DISPLAY MODE (preview) ─────────────────────────────────────────────────
// Renders exactly what exportMapToSvgString() produces — no empty
// placeholders, no builder chrome — with basic hover/click on nodes so you
// can sanity-check the finished map without leaving the builder.

let previewOpen = false;

function togglePreviewMode() {
  if (previewOpen) exitPreviewMode();
  else enterPreviewMode();
}

function enterPreviewMode() {
  closeSlotMenu();
  cancelConnection();
  cancelGroupLabelEditor();
  cancelProjectCatalogEditor();
  closeProjectPicker();
  cancelRoleCatalogEditor();
  closeRolePicker();
  cancelAreaCatalogEditor();
  closeAreaPicker();
  cancelMapSaveDialog();
  closeMapLoadPicker();
  cancelDeleteConfirm();

  previewOpen = true;
  document.getElementById('builderToolbar').style.display = 'none';
  document.getElementById('previewToggleBtn').textContent = 'Tillbaka till redigering';
  document.getElementById('headerHint').textContent = 'Klicka på en nod för att se titel/URL';
  document.querySelector('.layers-panel').style.display = 'none';
  document.querySelector('.zoom-controls').style.display = 'none';
  document.getElementById('zoomReadout').style.display = 'none';

  const host = document.getElementById('previewSvgHost');
  host.innerHTML = exportMapToSvgString();
  wirePreviewInteractivity(host);
  applyPreviewCss();
  closePreviewInfoPanel();

  document.getElementById('previewLayer').classList.add('open');
}

function exitPreviewMode() {
  previewOpen = false;
  document.getElementById('previewLayer').classList.remove('open');
  document.getElementById('builderToolbar').style.display = '';
  document.getElementById('previewToggleBtn').textContent = 'Förhandsgranska';
  document.getElementById('headerHint').textContent = 'Dra för att panorera · Scrolla för att zooma';
  document.querySelector('.layers-panel').style.display = '';
  document.querySelector('.zoom-controls').style.display = '';
  document.getElementById('zoomReadout').style.display = '';
}

// Text elements in the export already have pointer-events:none, so clicks
// on a card land on the underlying shape regardless of whether it's wrapped
// in an <a data-url> or not — one listener per shape covers both cases.
function wirePreviewInteractivity(host) {
  const svg = host.querySelector('svg');
  if (!svg) return;
  Array.from(svg.querySelectorAll('[data-role="node"]')).forEach(nodeEl => {
    nodeEl.style.cursor = 'pointer';
    nodeEl.addEventListener('mouseenter', () => nodeEl.setAttribute('opacity', '0.8'));
    nodeEl.addEventListener('mouseleave', () => nodeEl.removeAttribute('opacity'));
    nodeEl.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      showPreviewNodeInfo(nodeEl);
    });
  });
}

// ─── PREVIEW CSS ─────────────────────────────────────────────────────────────
// Purely a preview-time overlay — never part of exportMapToSvgString() or
// anything that gets saved. Same class names the export already produces,
// so whatever ends up looking right here can be copied straight into
// index.html's stylesheet as-is.

const DEFAULT_MAP_CSS = `/* Kartans stil — samma klasser som exporten producerar.
   Det som ser bra ut här kan klistras in direkt i index.html. */

.map-group-outline {
  stroke-width: 2.5px;
}

.map-group-label {
  font-size: 30px;
  letter-spacing: 0.06em;
}

.connector {
  stroke-width: 2.5px;
}

.map-project-card {
  /* fylls annars av projektets område */
}

.map-project-title {
  font-size: 13px;
}

.map-role {
  /* fylls annars av rollens område */
}

.map-role-icon {
  font-size: 26px;
}
`;

const previewCssInput = document.getElementById('previewCssInput');
previewCssInput.value = DEFAULT_MAP_CSS;
previewCssInput.addEventListener('input', applyPreviewCss);
previewCssInput.addEventListener('keydown', e => e.stopPropagation());

function applyPreviewCss() {
  const svg = document.querySelector('#previewSvgHost svg');
  if (!svg) return;
  let styleEl = svg.querySelector('#previewCustomStyle');
  if (!styleEl) {
    styleEl = document.createElementNS(svgNS, 'style');
    styleEl.setAttribute('id', 'previewCustomStyle');
    svg.insertBefore(styleEl, svg.firstChild);
  }
  styleEl.textContent = previewCssInput.value;
}

function showPreviewNodeInfo(nodeEl) {
  const rawId = nodeEl.getAttribute('id') || '';
  let title = rawId, description = '', url = '';

  if (rawId.startsWith('project-')) {
    const entry = projectCatalog[rawId.slice('project-'.length)];
    if (entry) { title = entry.title; url = entry.url || ''; }
  } else if (rawId.startsWith('role-')) {
    const entry = roleCatalog[rawId.slice('role-'.length)];
    if (entry) { title = entry.title; description = entry.description || ''; url = entry.url || ''; }
  }

  document.getElementById('previewInfoTitle').textContent = title || '(namnlös)';
  const descEl = document.getElementById('previewInfoDescription');
  descEl.textContent = description;
  descEl.style.display = description ? '' : 'none';
  const linkEl = document.getElementById('previewInfoLink');
  if (url) {
    linkEl.href = url;
    linkEl.style.display = '';
  } else {
    linkEl.style.display = 'none';
  }
  document.getElementById('previewInfoPanel').classList.add('open');
}

function closePreviewInfoPanel() {
  document.getElementById('previewInfoPanel').classList.remove('open');
}

// ─── AREA CATALOG (create in database, via header button) ──────────────────

const areaEditor = document.getElementById('areaEditor');
const areaNameInput = document.getElementById('areaNameInput');
const areaColorInput = document.getElementById('areaColorInput');
const areaEditorError = document.getElementById('areaEditorError');

function openAreaCatalogEditor() {
  closeSlotMenu();
  cancelConnection();
  cancelGroupLabelEditor();
  cancelProjectCatalogEditor();
  closeProjectPicker();
  cancelRoleCatalogEditor();
  closeRolePicker();
  closeAreaPicker();
  cancelMapSaveDialog();
  closeMapLoadPicker();
  cancelDeleteConfirm();

  const centerX = area.clientWidth / 2;
  const centerY = area.clientHeight / 2;
  areaEditor.style.left = centerX + 'px';
  areaEditor.style.top = centerY + 'px';
  areaEditor.classList.add('open');

  areaNameInput.value = '';
  areaColorInput.value = '#3a6df0';
  areaEditorError.textContent = '';
  requestAnimationFrame(() => areaNameInput.focus());
}

function cancelAreaCatalogEditor() {
  areaEditor.classList.remove('open');
}

function confirmAreaCatalogEditor() {
  const name = areaNameInput.value.trim();
  const color = areaColorInput.value;

  if (!name) {
    areaEditorError.textContent = 'Namn krävs.';
    areaNameInput.focus();
    return;
  }
  if (!projectDb) {
    areaEditorError.textContent = 'Databasen är inte redo än — försök igen om en stund.';
    return;
  }

  const id = slugify(name, 'omrade');
  if (areaCatalog[id]) {
    areaEditorError.textContent = 'Ett område med det namnet finns redan.';
    return;
  }

  const entry = { id, name, color };
  projectDb.ref('mapAreas/' + id).set(entry)
    .then(() => {
      areaCatalog[id] = entry; // optimistic
      onAreaCatalogUpdated();
      cancelAreaCatalogEditor();
    })
    .catch(err => {
      areaEditorError.textContent = 'Kunde inte spara. Försök igen.';
      console.error('[areaCatalog] save failed:', err);
    });
}

areaNameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); confirmAreaCatalogEditor(); }
  else if (e.key === 'Escape') { e.preventDefault(); cancelAreaCatalogEditor(); }
  e.stopPropagation();
});

// ─── AREA PICKER (assign an existing area to a group or connection) ────────

const areaPicker = document.getElementById('areaPicker');
const areaPickerFilter = document.getElementById('areaPickerFilter');
const areaPickerList = document.getElementById('areaPickerList');
let areaPickerTarget = null; // { type: 'group'|'connection', id }

function openAreaPickerForGroup(groupId) {
  closeSlotMenu();
  cancelConnection();

  areaPickerTarget = { type: 'group', id: groupId };
  const group = groups[groupId];
  const y = group.cy + group.r + AREA_SWATCH_BTN_OFFSET_Y;
  const pos = worldToScreen(group.cx, y);
  areaPicker.style.left = pos.x + 'px';
  areaPicker.style.top = pos.y + 'px';
  areaPicker.classList.add('open');

  areaPickerFilter.value = '';
  renderAreaPickerList('');
  requestAnimationFrame(() => areaPickerFilter.focus());
}

function openAreaPickerForConnection(connectionId) {
  closeSlotMenu();
  cancelConnection();

  const conn = connections.find(c => c.id === connectionId);
  if (!conn) return;

  areaPickerTarget = { type: 'connection', id: connectionId };
  const midX = (parseFloat(conn.visLineEl.getAttribute('x1')) + parseFloat(conn.visLineEl.getAttribute('x2'))) / 2;
  const midY = (parseFloat(conn.visLineEl.getAttribute('y1')) + parseFloat(conn.visLineEl.getAttribute('y2'))) / 2;
  const pos = worldToScreen(midX, midY);
  areaPicker.style.left = pos.x + 'px';
  areaPicker.style.top = pos.y + 'px';
  areaPicker.classList.add('open');

  areaPickerFilter.value = '';
  renderAreaPickerList('');
  requestAnimationFrame(() => areaPickerFilter.focus());
}

function closeAreaPicker() {
  areaPickerTarget = null;
  areaPicker.classList.remove('open');
}

function renderAreaPickerList(query) {
  const q = query.trim().toLowerCase();
  const entries = Object.values(areaCatalog).filter(a => !q || a.name.toLowerCase().includes(q));

  areaPickerList.innerHTML = '';

  const clearItem = document.createElement('div');
  clearItem.className = 'picker-item';
  clearItem.textContent = 'Inget område';
  clearItem.addEventListener('click', () => selectAreaForPickerTarget(null));
  areaPickerList.appendChild(clearItem);

  if (!entries.length) {
    const emptyMsg = Object.keys(areaCatalog).length
      ? 'Inga träffar.'
      : 'Inga områden i databasen ännu. Skapa ett via "+ Område" i menyn.';
    const empty = document.createElement('div');
    empty.className = 'picker-empty';
    empty.textContent = emptyMsg;
    areaPickerList.appendChild(empty);
    return;
  }

  entries.forEach(a => {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.style.display = 'flex';
    item.style.alignItems = 'center';
    item.style.gap = '8px';
    item.innerHTML = `<span style="width:12px;height:12px;border-radius:50%;background:${escapeHtml(a.color)};flex-shrink:0;display:inline-block;"></span>${escapeHtml(a.name)}`;
    item.addEventListener('click', () => selectAreaForPickerTarget(a.id));
    areaPickerList.appendChild(item);
  });
}

function selectAreaForPickerTarget(areaId) {
  if (!areaPickerTarget) return;
  const target = areaPickerTarget;
  closeAreaPicker();

  if (target.type === 'group') {
    const group = groups[target.id];
    if (!group) return;
    group.areaId = areaId;
    updateGroupAreaControl(target.id);
    applyGroupOutlineStyle(target.id);
  } else if (target.type === 'connection') {
    const conn = connections.find(c => c.id === target.id);
    if (!conn) return;
    conn.areaId = areaId;
    applyConnectionStyle(conn);
  }
}

const mapSaveDialog = document.getElementById('mapSaveDialog');
const mapSaveNameInput = document.getElementById('mapSaveNameInput');
const mapSaveError = document.getElementById('mapSaveError');

// Turns a display name into a Firebase-safe key (RTDB keys can't contain
// '.', '#', '$', '[', ']', or '/').
function slugify(name, fallback) {
  return name.trim().toLowerCase()
    .replace(/[.#$\[\]/]/g, '-')
    .replace(/\s+/g, '-')
    .replace(/[^a-z0-9-]/g, '')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '') || fallback;
}

function slugifyMapName(name) {
  return slugify(name, 'karta');
}

function openMapSaveDialog() {
  closeSlotMenu();
  cancelConnection();
  cancelGroupLabelEditor();
  cancelProjectCatalogEditor();
  closeProjectPicker();
  cancelRoleCatalogEditor();
  closeRolePicker();
  cancelAreaCatalogEditor();
  closeAreaPicker();
  closeMapLoadPicker();
  cancelDeleteConfirm();

  const centerX = area.clientWidth / 2;
  const centerY = area.clientHeight / 2;
  mapSaveDialog.style.left = centerX + 'px';
  mapSaveDialog.style.top = centerY + 'px';
  mapSaveDialog.classList.add('open');

  mapSaveNameInput.value = currentMapName || '';
  mapSaveError.textContent = '';
  requestAnimationFrame(() => { mapSaveNameInput.focus(); mapSaveNameInput.select(); });
}

function cancelMapSaveDialog() {
  mapSaveDialog.classList.remove('open');
}

function confirmMapSaveDialog() {
  const name = mapSaveNameInput.value.trim();
  if (!name) {
    mapSaveError.textContent = 'Namn krävs.';
    mapSaveNameInput.focus();
    return;
  }
  if (!projectDb) {
    mapSaveError.textContent = 'Databasen är inte redo än — försök igen om en stund.';
    return;
  }

  const key = slugifyMapName(name);
  cancelMapSaveDialog();

  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = 'Sparar…';
  const svgString = exportMapToSvgString();
  const entry = { name, svg: svgString, savedAt: firebase.database.ServerValue.TIMESTAMP };

  projectDb.ref('maps/' + key).set(entry)
    .then(() => {
      mapCatalog[key] = { name, svg: svgString, savedAt: Date.now() }; // optimistic
      currentMapKey = key;
      currentMapName = name;
      const restUrl = firebaseConfig.databaseURL + '/maps/' + key + '/svg.json';
      statusEl.innerHTML = `Sparad som "${escapeHtml(name)}" ✓ — <a href="${escapeHtml(restUrl)}" target="_blank" style="color:#7fb8ff;">visa rådata</a>`;
    })
    .catch(err => {
      statusEl.textContent = 'Kunde inte spara. Se konsolen.';
      console.error('[confirmMapSaveDialog] failed:', err);
    });
}

});

// ─── LOAD (pick from saved maps) ────────────────────────────────────────────
// Reverses the export: fetches a chosen saved SVG from Firebase and rebuilds
// the full builder state (groups, rings, node placements, connections) from
// the data-* attributes embedded in it.

const mapLoadPicker = document.getElementById('mapLoadPicker');
const mapLoadPickerFilter = document.getElementById('mapLoadPickerFilter');
const mapLoadPickerList = document.getElementById('mapLoadPickerList');
let mapLoadPickerOpen = false;
let pendingMapLoad = null; // { key, entry } while the overwrite-confirm is up

function openMapLoadPicker() {
  closeSlotMenu();
  cancelConnection();
  cancelGroupLabelEditor();
  cancelProjectCatalogEditor();
  closeProjectPicker();
  cancelRoleCatalogEditor();
  closeRolePicker();
  cancelAreaCatalogEditor();
  closeAreaPicker();
  cancelMapSaveDialog();
  cancelDeleteConfirm();

  mapLoadPickerOpen = true;
  const centerX = area.clientWidth / 2;
  const centerY = area.clientHeight / 2;

  mapLoadPicker.style.top = centerY + 'px';
  mapLoadPicker.classList.add('open');

  requestAnimationFrame(() => mapLoadPickerFilter.focus());
}

function closeMapLoadPicker() {
  mapLoadPickerOpen = false;
  mapLoadPicker.classList.remove('open');
}

function renderMapLoadPickerList(query) {
  const q = query.trim().toLowerCase();
  const entries = Object.entries(mapCatalog).filter(([key, m]) =>
    !q || (m.name || key).toLowerCase().includes(q)
  );

  if (!entries.length) {
    const emptyMsg = Object.keys(mapCatalog).length
      ? 'Inga träffar.'
      : 'Inga sparade kartor ännu.';
    mapLoadPickerList.innerHTML = `<div class="picker-empty">${escapeHtml(emptyMsg)}</div>`;
    return;
  }

  mapLoadPickerList.innerHTML = '';
  entries
    .sort((a, b) => (b[1].savedAt || 0) - (a[1].savedAt || 0)) // most recent first
    .forEach(([key, m]) => {
      const item = document.createElement('div');
      item.className = 'picker-item';
      item.innerHTML = `${escapeHtml(m.name || key)}<span class="picker-item-id">${escapeHtml(key)}</span>`;
      item.addEventListener('click', () => selectMapToLoad(key));
      mapLoadPickerList.appendChild(item);
    });
}

mapLoadPickerFilter.addEventListener('input', () => renderMapLoadPickerList(mapLoadPickerFilter.value));
mapLoadPickerFilter.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeMapLoadPicker(); }
  e.stopPropagation();
});

function selectMapToLoad(key) {
  closeMapLoadPicker();
  const entry = mapCatalog[key];
  if (!entry) return;

  pendingMapLoad = { key, entry };
  if (!Object.keys(groups).length) {
    performSelectedMapLoad();
    return;
  }

  deleteConfirmTarget = { type: 'loadMap' };
  deleteConfirmText.textContent = `Läsa in "${entry.name || key}"? Den nuvarande, osparade kartan skrivs över.`;
  document.getElementById('deleteConfirmOkBtn').textContent = 'Läs in';
  const centerX = area.clientWidth / 2;
  const centerY = area.clientHeight / 2;
  deleteConfirm.style.left = centerX + 'px';
  deleteConfirm.style.top = centerY + 'px';
  deleteConfirm.classList.add('open');
}

function performSelectedMapLoad() {
  if (!pendingMapLoad) return;
  const { key, entry } = pendingMapLoad;
  pendingMapLoad = null;

  importMapFromSvgString(entry.svg);
  currentMapKey = key;
  currentMapName = entry.name || key;
  document.getElementById('saveStatus').textContent = `Inläst: "${currentMapName}" ✓`;
}

function importMapFromSvgString(svgString) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(svgString, 'image/svg+xml');
  if (doc.querySelector('parsererror')) {
    console.error('[importMap] Could not parse the saved SVG.');
    return;
  }

  // ── Wipe current state ──
  nodesLayer.innerHTML = '';
  connectorsLayer.innerHTML = '';
  guidesLayer.innerHTML = '';
  Array.from(svgDefs.querySelectorAll('path[id^="label-path-"]')).forEach(el => el.remove());

  groups = {};
  layers = [];
  connections = [];
  centralGroupId = null;
  groupIdCounter = 1;
  layerIdCounter = 1;
  connectionIdCounter = 1;
  document.getElementById('coreStatus').textContent = 'Ej skapad';

  // ── Groups ──
  const layerBuckets = {}; // layerId -> { index, groupIds: [] }

  Array.from(doc.querySelectorAll('[data-role="group"]')).forEach(el => {
    const id = el.getAttribute('data-group-id');
    const cx = parseFloat(el.getAttribute('cx'));
    const cy = parseFloat(el.getAttribute('cy'));
    createGroupAt(cx, cy, id); // reuses the original id, so references still resolve

    const group = groups[id];
    group.r = parseFloat(el.getAttribute('r'));
    group.label = el.getAttribute('data-label') || '';
    group.labelAngle = parseFloat(el.getAttribute('data-label-angle'));
    const slotOrderRaw = el.getAttribute('data-slot-order') || '1,2,3,4,5,6,7,8';
    group.slotAngleOrder = slotOrderRaw.split(',').map(Number);
    group.areaId = el.getAttribute('data-area-id') || null;

    const layerId = el.getAttribute('data-layer-id') || '';
    if (!layerId) {
      centralGroupId = id;
    } else {
      const layerIndex = parseInt(el.getAttribute('data-layer-index') || '1', 10);
      if (!layerBuckets[layerId]) layerBuckets[layerId] = { index: layerIndex, groupIds: [] };
      layerBuckets[layerId].groupIds.push(id);
      group.layerId = layerId;
    }
  });

  if (centralGroupId) document.getElementById('coreStatus').textContent = 'Skapad';

  // ── Rings, ordered by angle around the map center for sensible ↺↻ behaviour ──
  Object.entries(layerBuckets).forEach(([layerId, bucket]) => {
    bucket.groupIds.sort((a, b) => {
      const angleA = Math.atan2(groups[a].cy - MAP_CENTER.y, groups[a].cx - MAP_CENTER.x);
      const angleB = Math.atan2(groups[b].cy - MAP_CENTER.y, groups[b].cx - MAP_CENTER.x);
      return angleA - angleB;
    });
    layers.push({ id: layerId, index: bucket.index, radius: RING_SPACING * bucket.index, groupIds: bucket.groupIds });
  });
  layers.sort((a, b) => a.index - b.index);
  layers.forEach(layer => {
    const guide = document.createElementNS(svgNS, 'circle');
    guide.setAttribute('class', 'layer-ring-guide');
    guide.setAttribute('cx', MAP_CENTER.x);
    guide.setAttribute('cy', MAP_CENTER.y);
    guide.setAttribute('r', layer.radius);
    guidesLayer.appendChild(guide);
    layer.guideEl = guide;
  });

  // Recompute every group's slots/label/controls now that r, label, labelAngle
  // and slotAngleOrder are all in place.
  Object.keys(groups).forEach(id => applyGroupLayout(id));

  // ── Filled nodes ──
  Array.from(doc.querySelectorAll('[data-role="node"]')).forEach(el => {
    const groupId = el.getAttribute('data-group-id');
    const slotIndex = parseInt(el.getAttribute('data-slot-index'), 10);
    const group = groups[groupId];
    if (!group) return;
    const slot = group.slots[slotIndex];
    if (!slot) return;

    const rawId = el.getAttribute('id') || '';
    if (rawId.startsWith('project-')) {
      slot.type = 'project';
      slot.projectId = rawId.slice('project-'.length);
    } else if (rawId.startsWith('role-')) {
      slot.type = 'role';
      slot.roleId = rawId.slice('role-'.length);
    }
    renderSlot(groupId, slot);
  });

  // ── Connections ──
  Array.from(doc.querySelectorAll('line.connector')).forEach(el => {
    const from = { groupId: el.getAttribute('data-from-group'), slotIndex: parseInt(el.getAttribute('data-from-slot'), 10) };
    const to = { groupId: el.getAttribute('data-to-group'), slotIndex: parseInt(el.getAttribute('data-to-slot'), 10) };
    const fromSlot = getSlot(from.groupId, from.slotIndex);
    const toSlot = getSlot(to.groupId, to.slotIndex);
    if (!fromSlot || !toSlot) return;

    const id = 'connection-' + connectionIdCounter++;
    const { g, hitLine, visLine } = createConnectorElements(fromSlot.x, fromSlot.y, toSlot.x, toSlot.y, id);
    const conn = {
      id, from, to, el: g, hitLineEl: hitLine, visLineEl: visLine,
      areaId: el.getAttribute('data-area-id') || null,
    };
    connections.push(conn);
    applyConnectionStyle(conn);
  });

  // ── Keep future id generation collision-free ──
  Object.keys(groups).forEach(id => {
    const n = parseInt(id.replace('group-', ''), 10);
    if (!isNaN(n) && n >= groupIdCounter) groupIdCounter = n + 1;
  });
  layers.forEach(layer => {
    const n = parseInt(layer.id.replace('layer-', ''), 10);
    if (!isNaN(n) && n >= layerIdCounter) layerIdCounter = n + 1;
  });

  renderLayersPanel();
}

// ─── GROUP SCALE (+/-) ──────────────────────────────────────────────────────
// Sits one row below the order arrows, on every group (central or ringed).

const SCALE_STEP = 50;          // world units — 100px change in diameter per click
const MIN_GROUP_RADIUS = 100;   // 200px diameter floor
const MAX_GROUP_RADIUS = 600;   // 1200px diameter ceiling
const SCALE_BTN_OFFSET_Y = 80;  // one row below the order arrows

function scaleGroup(groupId, deltaRadius) {
  const group = groups[groupId];
  if (!group) return;
  const newR = Math.min(MAX_GROUP_RADIUS, Math.max(MIN_GROUP_RADIUS, group.r + deltaRadius));
  if (newR === group.r) return;
  group.r = newR;
  moveGroupTo(groupId, group.cx, group.cy); // recomputes slots, label, order/scale controls, connections
}

function updateGroupScaleControls(groupId) {
  const group = groups[groupId];
  if (!group) return;
  const container = group.scaleControlsEl;
  container.innerHTML = '';

  const y = group.cy + group.r + SCALE_BTN_OFFSET_Y;
  const atMin = group.r <= MIN_GROUP_RADIUS;
  const atMax = group.r >= MAX_GROUP_RADIUS;

  container.appendChild(createOrderBtn(group.cx - ORDER_BTN_OFFSET_X, y, '−', () => scaleGroup(groupId, -SCALE_STEP), atMin));
  container.appendChild(createOrderBtn(group.cx + ORDER_BTN_OFFSET_X, y, '+', () => scaleGroup(groupId, SCALE_STEP), atMax));
}

// ─── LABEL POSITION (rotate clockwise / counter-clockwise) ─────────────────
// A third row, only shown once a group has a label — nudges the label (and
// the slot gap that follows it) one step around the ring's circumference.

const LABEL_ROTATE_STEP_DEGREES = 45; // matches the ring's natural 8-slot grid
const LABEL_ROTATE_BTN_OFFSET_Y = 120; // one row below the scale controls

function rotateGroupLabel(groupId, direction) {
  const group = groups[groupId];
  if (!group || !group.label) return;
  const step = LABEL_ROTATE_STEP_DEGREES * Math.PI / 180;
  group.labelAngle = (group.labelAngle ?? -Math.PI / 2) + direction * step;
  moveGroupTo(groupId, group.cx, group.cy); // recomputes label path + nudged slot gap
}

function updateGroupLabelRotateControls(groupId) {
  const group = groups[groupId];
  if (!group) return;
  const container = group.labelRotateControlsEl;
  container.innerHTML = '';

  if (!group.label) return; // nothing to rotate if there's no label yet

  const y = group.cy + group.r + LABEL_ROTATE_BTN_OFFSET_Y;
  container.appendChild(createOrderBtn(group.cx - ORDER_BTN_OFFSET_X, y, '‹', () => rotateGroupLabel(groupId, -1)));
  container.appendChild(createOrderBtn(group.cx + ORDER_BTN_OFFSET_X, y, '›', () => rotateGroupLabel(groupId, 1)));
}

// ─── DELETE GROUP (control button) ─────────────────────────────────────────
// A single button one row below the label-rotate arrows — always shown,
// on every group including the central one.

const GROUP_DELETE_BTN_OFFSET_Y = 160;

function updateGroupDeleteControl(groupId) {
  const group = groups[groupId];
  if (!group) return;
  const container = group.deleteControlEl;
  container.innerHTML = '';

  const y = group.cy + group.r + GROUP_DELETE_BTN_OFFSET_Y;
