// ─── AREA ASSIGNMENT (group) ────────────────────────────────────────────────
// One more row below delete — a single swatch button showing the group's
// current area color (or a neutral outline when unassigned).

const AREA_SWATCH_BTN_RADIUS = 16;
const AREA_SWATCH_BTN_OFFSET_Y = 200; // one row below the delete button
const DEFAULT_GROUP_STROKE = '#fff';

// Line widths are global, not per-object — same rationale as colors: these
// are just attribute defaults, and index.html's CSS (.map-group-outline,
// .connector) can override them for the whole map at once.
const GROUP_OUTLINE_WIDTH = 2.5;
const CONNECTOR_WIDTH = 2.5;

function updateGroupAreaControl(groupId) {
  const group = groups[groupId];
  if (!group) return;
  const container = group.areaControlEl;
  container.innerHTML = '';

  const area = group.areaId ? areaCatalog[group.areaId] : null;
  const y = group.cy + group.r + AREA_SWATCH_BTN_OFFSET_Y;

  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('class', 'area-swatch-btn');
  const circle = document.createElementNS(svgNS, 'circle');
  circle.setAttribute('class', 'area-swatch-bg');
  circle.setAttribute('cx', group.cx);
  circle.setAttribute('cy', y);
  circle.setAttribute('r', AREA_SWATCH_BTN_RADIUS);
  circle.setAttribute('fill', area ? area.color : 'rgba(255,255,255,0.06)');
  g.appendChild(circle);
  g.addEventListener('click', e => {
    e.stopPropagation();
    openAreaPickerForGroup(groupId);
  });
  container.appendChild(g);
}

// Applies the group's area color to its outline circle's stroke — fill
// stays the constant dark translucent background for content readability.
function applyGroupOutlineStyle(groupId) {
  const group = groups[groupId];
  if (!group) return;
  const area = group.areaId ? areaCatalog[group.areaId] : null;
  group.circleEl.style.stroke = area ? area.color : DEFAULT_GROUP_STROKE;
  group.circleEl.style.strokeWidth = GROUP_OUTLINE_WIDTH + 'px';
}

// Spaces every group on a ring evenly around its circumference,
// starting at 12 o'clock — same approach as the main app's student rings.
function redistributeLayer(layer) {
  const count = layer.groupIds.length;
  if (!count) return;
  const angleStep = (2 * Math.PI) / count;
  layer.groupIds.forEach((groupId, i) => {
    const angle = -Math.PI / 2 + i * angleStep;
    const cx = MAP_CENTER.x + layer.radius * Math.cos(angle);
    const cy = MAP_CENTER.y + layer.radius * Math.sin(angle);
    moveGroupTo(groupId, cx, cy);
  });
}

function renderLayersPanel() {
  const list = document.getElementById('layersList');
  const empty = document.getElementById('layersEmpty');
  list.innerHTML = '';
  empty.style.display = layers.length ? 'none' : 'block';

  layers.forEach(layer => {
    const row = document.createElement('div');
    row.className = 'layer-row';
    row.innerHTML = `
      <span class="layer-name">Lager ${layer.index}</span>
      <span class="layer-count">${layer.groupIds.length} grupp${layer.groupIds.length === 1 ? '' : 'er'}</span>
      <button class="layer-add-btn">+ Grupp</button>
    `;
    row.querySelector('.layer-add-btn').addEventListener('click', () => addGroupToLayer(layer.id));
    list.appendChild(row);
  });
}

// Returns 9 positions: index 0 = center, 1..8 spaced around the outline.
// When gapRad > 0, a wedge of that angular width is left open — centered at
// gapCenter (defaults to 12 o'clock) — so a curved label can sit there
// without a node behind it. gapCenter rotates with the label position.
function buildSlotPositions(cx, cy, r, gapRad = 0, gapCenter = -Math.PI / 2) {
  const positions = [{ x: cx, y: cy, isCenter: true }];
  const available = (2 * Math.PI) - gapRad;
  const angleStep = available / SLOT_COUNT;
  const buffer = gapRad > 0 ? angleStep / 2 : 0; // small symmetric margin either side of the gap
  const start = gapCenter + gapRad / 2 + buffer;
  for (let i = 0; i < SLOT_COUNT; i++) {
    const angle = start + i * angleStep;
    positions.push({
      x: cx + r * Math.cos(angle),
      y: cy + r * Math.sin(angle),
      isCenter: false,
    });
  }
  return positions;
}

function getLabelGapRadians(group) {
  return (group.label && group.label.trim()) ? (LABEL_GAP_DEGREES * Math.PI / 180) : 0;
}

}

function renderProjectPickerList(query) {
  const q = query.trim().toLowerCase();
  const entries = Object.values(projectCatalog).filter(p =>
    !q || p.title.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)
  );

  if (!entries.length) {
    const emptyMsg = Object.keys(projectCatalog).length
      ? 'Inga träffar.'
      : 'Inga projekt i databasen ännu. Skapa ett via "+ Projekt" i menyn.';
    projectPickerList.innerHTML = `<div class="picker-empty">${escapeHtml(emptyMsg)}</div>`;
    return;
  }

  projectPickerList.innerHTML = '';
  entries.forEach(p => {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.innerHTML = `${escapeHtml(p.title)}<span class="picker-item-id">${escapeHtml(p.id)}</span>`;
    item.addEventListener('click', () => selectProjectForSlot(p.id));
    projectPickerList.appendChild(item);
  });
}

function selectProjectForSlot(projectId) {
  if (!projectPickerTarget) return;
  const { groupId, slotIndex } = projectPickerTarget;
  closeProjectPicker();

  const slot = getSlot(groupId, slotIndex);
  if (!slot) return;

  slot.type = 'project';
  slot.projectId = projectId;
  renderSlot(groupId, slot);
}

projectPickerFilter.addEventListener('input', () => renderProjectPickerList(projectPickerFilter.value));
projectPickerFilter.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeProjectPicker(); }
  e.stopPropagation();
});

// ─── ROLE CATALOG (create in database, via header button) ──────────────────
// Not tied to any node — this just adds a new entry to /mapRoles. Placing a
// role on the map happens separately, via the picker below.

const roleEditor = document.getElementById('roleEditor');
const roleTitleInput = document.getElementById('roleTitleInput');
const roleDescriptionInput = document.getElementById('roleDescriptionInput');
const roleUrlInput = document.getElementById('roleUrlInput');
const roleIdInput = document.getElementById('roleIdInput');
const roleEditorError = document.getElementById('roleEditorError');

function openRoleCatalogEditor() {
  closeSlotMenu();
  cancelConnection();
  cancelGroupLabelEditor();
  cancelProjectCatalogEditor();
  closeProjectPicker();
  closeRolePicker();
  cancelAreaCatalogEditor();
  closeAreaPicker();
  cancelMapSaveDialog();
  closeMapLoadPicker();
  cancelDeleteConfirm();

  const centerX = area.clientWidth / 2;
  const centerY = area.clientHeight / 2;
  roleEditor.style.left = centerX + 'px';
  roleEditor.style.top = centerY + 'px';
  roleEditor.classList.add('open');

  roleTitleInput.value = '';
  roleDescriptionInput.value = '';
  roleUrlInput.value = '';
  roleIdInput.value = '';
  document.getElementById('roleAreaSelect').value = '';
  roleEditorError.textContent = '';
  requestAnimationFrame(() => roleTitleInput.focus());
}

function cancelRoleCatalogEditor() {
  roleEditor.classList.remove('open');
}

function submitRoleCatalogEditor() {
  const title = roleTitleInput.value.trim();
  const description = roleDescriptionInput.value.trim();
  const url = roleUrlInput.value.trim();
  const id = roleIdInput.value.trim();

  if (!title) {
    roleEditorError.textContent = 'Titel krävs.';
    roleTitleInput.focus();
    return;
  }
  if (!id) {
    roleEditorError.textContent = 'ID krävs.';
    roleIdInput.focus();
    return;
  }
  if (roleCatalog[id]) {
    roleEditorError.textContent = 'Det här ID:t finns redan — välj ett annat.';
    roleIdInput.focus();
    return;
  }
  if (!projectDb) {
    roleEditorError.textContent = 'Databasen är inte redo än — försök igen om en stund.';
    return;
  }

  const entry = { title, description, url, id, area: document.getElementById('roleAreaSelect').value };
  projectDb.ref('mapRoles/' + id).set(entry)
    .then(() => {
      roleCatalog[id] = entry; // optimistic, the live listener will also confirm this
      cancelRoleCatalogEditor();
    })
    .catch(err => {
      roleEditorError.textContent = 'Kunde inte spara. Försök igen.';
      console.error('[roleCatalog] save failed:', err);
    });
}

[roleTitleInput, roleUrlInput, roleIdInput].forEach(input => {
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitRoleCatalogEditor(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelRoleCatalogEditor(); }
    e.stopPropagation();
  });
});
// The description is a textarea — Enter should add a newline, not submit.
roleDescriptionInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); cancelRoleCatalogEditor(); }
  e.stopPropagation();
});

// ─── ROLE PICKER (link an existing catalog role to a node) ─────────────────

const rolePicker = document.getElementById('rolePicker');
const rolePickerFilter = document.getElementById('rolePickerFilter');
const rolePickerList = document.getElementById('rolePickerList');
let rolePickerTarget = null; // { groupId, slotIndex }

function openRolePicker(groupId, slotIndex) {
  const slot = getSlot(groupId, slotIndex);
  if (!slot) return;

  closeSlotMenu();
  cancelConnection();

  rolePickerTarget = { groupId, slotIndex };
  const pos = worldToScreen(slot.x, slot.y);
  rolePicker.style.left = pos.x + 'px';
  rolePicker.style.top = pos.y + 'px';
  rolePicker.classList.add('open');

  rolePickerFilter.value = '';
  renderRolePickerList('');
  requestAnimationFrame(() => rolePickerFilter.focus());
}

function closeRolePicker() {
  rolePickerTarget = null;
  rolePicker.classList.remove('open');
}

function renderRolePickerList(query) {
  const q = query.trim().toLowerCase();
  const entries = Object.values(roleCatalog).filter(r =>
    !q || (r.title || '').toLowerCase().includes(q) || r.id.toLowerCase().includes(q)
  );

  if (!entries.length) {
    const emptyMsg = Object.keys(roleCatalog).length
      ? 'Inga träffar.'
      : 'Inga roller i databasen ännu. Skapa en via "+ Roll" i menyn.';
    rolePickerList.innerHTML = `<div class="picker-empty">${escapeHtml(emptyMsg)}</div>`;
    return;
  }

  rolePickerList.innerHTML = '';
  entries.forEach(r => {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.innerHTML = `${escapeHtml(r.title || r.id)}<span class="picker-item-id">${escapeHtml(r.id)}</span>`;
    item.addEventListener('click', () => selectRoleForSlot(r.id));
    rolePickerList.appendChild(item);
  });
}

function selectRoleForSlot(roleId) {
  if (!rolePickerTarget) return;
  const { groupId, slotIndex } = rolePickerTarget;
  closeRolePicker();

  const slot = getSlot(groupId, slotIndex);
  if (!slot) return;

  slot.type = 'role';
  slot.roleId = roleId;
  renderSlot(groupId, slot);
}

rolePickerFilter.addEventListener('input', () => renderRolePickerList(rolePickerFilter.value));
rolePickerFilter.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeRolePicker(); }
  e.stopPropagation();
});

// Builds/updates the invisible arc path (living in <defs>) that the label
// text curves along. Centered on group.labelAngle — defaults to the top of
// the ring, but rotates with it when the label position is nudged.
function updateGroupLabelPath(groupId) {
  const group = groups[groupId];
  if (!group.labelPathEl) {
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('id', `label-path-${groupId}`);
    path.setAttribute('fill', 'none');
    svgDefs.appendChild(path);
    group.labelPathEl = path;
  }
  const r = group.r + LABEL_RADIUS_OFFSET;
  const labelAngle = group.labelAngle ?? -Math.PI / 2;
  const startAngle = labelAngle - Math.PI / 2;
  const endAngle = labelAngle + Math.PI / 2;
  const p1x = group.cx + r * Math.cos(startAngle);
  const p1y = group.cy + r * Math.sin(startAngle);
  const p2x = group.cx + r * Math.cos(endAngle);
  const p2y = group.cy + r * Math.sin(endAngle);
  const d = `M ${p1x} ${p1y} A ${r} ${r} 0 0 1 ${p2x} ${p2y}`;
  group.labelPathEl.setAttribute('d', d);
}

function renderGroupLabelText(groupId) {
  const group = groups[groupId];
  if (!group.labelTextEl) {
    const text = document.createElementNS(svgNS, 'text');
    text.setAttribute('class', 'group-label');
    const textPath = document.createElementNS(svgNS, 'textPath');
    textPath.setAttribute('startOffset', '50%');
    textPath.setAttribute('text-anchor', 'middle');
    text.appendChild(textPath);
    group.el.appendChild(text);
    group.labelTextEl = text;
    group.labelTextPathEl = textPath;
  }
  group.labelTextPathEl.setAttributeNS('http://www.w3.org/1999/xlink', 'href', `#label-path-${groupId}`);
  group.labelTextPathEl.setAttribute('href', `#label-path-${groupId}`);
  group.labelTextPathEl.textContent = group.label || '';
  group.labelTextEl.style.display = group.label ? '' : 'none';
}

function getSlot(groupId, slotIndex) {
  const group = groups[groupId];
  if (!group) return null;
  return group.slots[slotIndex] || null;
}

// Rebuilds a slot's visual contents based on its current state
// (empty / filled / connecting).
function renderSlot(groupId, slot) {
  const g = slot.el;
  g.innerHTML = '';
  g.setAttribute('class', 'node-slot'
    + (slot.type ? ` is-filled type-${slot.type}` : '')
    + (connectingFrom && connectingFrom.groupId === groupId && connectingFrom.slotIndex === slot.index ? ' is-connecting' : ''));

  let visualHalfHeight = SLOT_RADIUS;
  let visualHalfWidth = SLOT_RADIUS;

  if (slot.type === 'project') {
    visualHalfHeight = PROJECT_RECT_HEIGHT / 2;
    visualHalfWidth = PROJECT_RECT_WIDTH / 2;

    const catalogEntry = projectCatalog[slot.projectId];
    const projectArea = catalogEntry && catalogEntry.area ? areaCatalog[catalogEntry.area] : null;

    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('class', 'project-card');
    rect.setAttribute('x', slot.x - PROJECT_RECT_WIDTH / 2);
    rect.setAttribute('y', slot.y - PROJECT_RECT_HEIGHT / 2);
    rect.setAttribute('width', PROJECT_RECT_WIDTH);
    rect.setAttribute('height', PROJECT_RECT_HEIGHT);
    rect.setAttribute('rx', PROJECT_RECT_RX);
    rect.style.fill = projectArea ? projectArea.color : '#3a6df0';
    g.appendChild(rect);

    const title = document.createElementNS(svgNS, 'text');
    title.setAttribute('class', 'project-card-title');
    title.setAttribute('x', slot.x);
    title.setAttribute('y', slot.y);
    title.textContent = catalogEntry ? catalogEntry.title : '…';
    g.appendChild(title);
  } else {
    const circle = document.createElementNS(svgNS, 'circle');
    circle.setAttribute('class', 'slot-outline');
    circle.setAttribute('cx', slot.x);
    circle.setAttribute('cy', slot.y);
    circle.setAttribute('r', SLOT_RADIUS);
    if (slot.type === 'role') {
      const catalogEntry = roleCatalog[slot.roleId];
      const roleArea = catalogEntry && catalogEntry.area ? areaCatalog[catalogEntry.area] : null;
      if (roleArea) {
        circle.style.fill = roleArea.color;
        circle.style.fillOpacity = '0.35';
      } else {
        circle.style.fill = 'rgba(240,168,58,0.35)';
      }
    }
    g.appendChild(circle);

    if (slot.type) {
      const icon = document.createElementNS(svgNS, 'text');
      icon.setAttribute('class', 'slot-icon');
      icon.setAttribute('x', slot.x);
      icon.setAttribute('y', slot.y);
      icon.textContent = TYPE_ICON[slot.type];
      g.appendChild(icon);
    } else {
      const plus = document.createElementNS(svgNS, 'text');
      plus.setAttribute('class', 'slot-plus');
      plus.setAttribute('x', slot.x);
      plus.setAttribute('y', slot.y);
      plus.textContent = '+';
      g.appendChild(plus);
    }
  }

  // Delete button — only on filled nodes, top-right corner of whichever
  // shape is showing (works for both the center slot and outline slots).
  if (slot.type) {
    const dx = slot.x + visualHalfWidth * 0.78;
    const dy = slot.y - visualHalfHeight * 0.78;
    g.appendChild(createDeleteBtn(dx, dy, () => requestDeleteNode(groupId, slot.index)));
  }

  // Reorder arrows — only the 8 outline nodes have an order; the lone
  // center slot doesn't. Offset from whichever shape is currently showing.
  if (!slot.isCenter) {
    const y = slot.y + visualHalfHeight + NODE_ORDER_BTN_GAP;
    g.appendChild(createOrderBtn(slot.x - NODE_ORDER_BTN_OFFSET_X, y, '↺', () => moveNodeOnRing(groupId, slot.index, -1), false, NODE_ORDER_BTN_RADIUS, 12));
    g.appendChild(createOrderBtn(slot.x + NODE_ORDER_BTN_OFFSET_X, y, '↻', () => moveNodeOnRing(groupId, slot.index, 1), false, NODE_ORDER_BTN_RADIUS, 12));
  }
}

function onSlotClick(groupId, slotIndex) {
  const slot = getSlot(groupId, slotIndex);
  if (!slot) return;

  if (connectingFrom) {
    if (connectingFrom.groupId === groupId && connectingFrom.slotIndex === slotIndex) {
      cancelConnection();
    } else {
      completeConnection(connectingFrom, { groupId, slotIndex });
    }
    return;
  }

  if (slot.type) {
    // Filled node clicked — editing existing nodes is a later step.
    console.log('Node clicked (editing not implemented yet):', groupId, slotIndex, slot.type);
    return;
  }

  openSlotMenu(groupId, slotIndex, slot.x, slot.y);
}

// ─── SUBMENU: create project / create role / create connection ────────────

function worldToScreen(x, y) {
  const pt = svg.createSVGPoint();
  pt.x = x; pt.y = y;
  const screenPt = pt.matrixTransform(svg.getScreenCTM());
  const areaRect = area.getBoundingClientRect();
  return { x: screenPt.x - areaRect.left, y: screenPt.y - areaRect.top };
}

function openSlotMenu(groupId, slotIndex, worldX, worldY) {
  menuTarget = { groupId, slotIndex };
  const pos = worldToScreen(worldX, worldY);
  slotMenu.style.left = pos.x + 'px';
  slotMenu.style.top = pos.y + 'px';
  slotMenu.classList.add('open');
}

function closeSlotMenu() {
  menuTarget = null;
  slotMenu.classList.remove('open');
}

function handleMenuChoice(choice) {
  if (!menuTarget) return;
  const { groupId, slotIndex } = menuTarget;
  closeSlotMenu();

  if (choice === 'project') {
    openProjectPicker(groupId, slotIndex);
  } else if (choice === 'role') {
    openRolePicker(groupId, slotIndex);
  } else if (choice === 'connection') {
    startConnection(groupId, slotIndex);
  }
}

// ─── CONNECTIONS ────────────────────────────────────────────────────────────

function startConnection(groupId, slotIndex) {
  connectingFrom = { groupId, slotIndex };
  renderSlot(groupId, getSlot(groupId, slotIndex));
}

function cancelConnection() {
  if (!connectingFrom) return;
  const { groupId, slotIndex } = connectingFrom;
  connectingFrom = null;
  const slot = getSlot(groupId, slotIndex);
  if (slot) renderSlot(groupId, slot);
}

// Builds a connector's DOM: an invisible wide "hit" line (for reliable
// clicking) layered with the thin visible line. Shared by connection
// creation and import, so both stay in sync.
function createConnectorElements(x1, y1, x2, y2, connectionId) {
  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('class', 'connector-group');

  const hitLine = document.createElementNS(svgNS, 'line');
  hitLine.setAttribute('class', 'connector-hit');
  hitLine.setAttribute('x1', x1); hitLine.setAttribute('y1', y1);
  hitLine.setAttribute('x2', x2); hitLine.setAttribute('y2', y2);
  hitLine.addEventListener('click', e => {
    e.stopPropagation();
    openAreaPickerForConnection(connectionId);
  });

  const visLine = document.createElementNS(svgNS, 'line');
  visLine.setAttribute('class', 'connector-line');
  visLine.setAttribute('x1', x1); visLine.setAttribute('y1', y1);
  visLine.setAttribute('x2', x2); visLine.setAttribute('y2', y2);
  visLine.style.pointerEvents = 'none';

  g.appendChild(hitLine);
  g.appendChild(visLine);
  connectorsLayer.appendChild(g);

  return { g, hitLine, visLine };
}

// Applies a connection's area color (if any) and width to its visible line.
function applyConnectionStyle(conn) {
  const connArea = conn.areaId ? areaCatalog[conn.areaId] : null;
  conn.visLineEl.style.stroke = connArea ? connArea.color : 'rgba(255,255,255,0.4)';
  conn.visLineEl.style.strokeWidth = CONNECTOR_WIDTH + 'px';
}

function completeConnection(from, to) {
  const fromSlot = getSlot(from.groupId, from.slotIndex);
  const toSlot = getSlot(to.groupId, to.slotIndex);
  connectingFrom = null;
  if (fromSlot) renderSlot(from.groupId, fromSlot);
  if (!fromSlot || !toSlot) return;

  const id = 'connection-' + connectionIdCounter++;
  const { g, hitLine, visLine } = createConnectorElements(fromSlot.x, fromSlot.y, toSlot.x, toSlot.y, id);
  const conn = { id, from, to, el: g, hitLineEl: hitLine, visLineEl: visLine, areaId: null };
  connections.push(conn);
  applyConnectionStyle(conn);
}

// Clicking empty canvas: close the menu / cancel an in-progress connection.
area.addEventListener('click', e => {
  if (previewOpen) return;
  if (e.target.closest('.node-slot') || e.target.closest('.slot-menu') || e.target.closest('.zoom-btn') || e.target.closest('.add-btn') || e.target.closest('.layers-panel') || e.target.closest('.label-editor') || e.target.closest('.project-editor') || e.target.closest('.project-picker') || e.target.closest('.delete-confirm')) return;
  closeSlotMenu();
  cancelConnection();
  cancelProjectCatalogEditor();
  closeProjectPicker();
  cancelRoleCatalogEditor();
  closeRolePicker();
  cancelAreaCatalogEditor();
  closeAreaPicker();
  cancelMapSaveDialog();
  closeMapLoadPicker();
  cancelDeleteConfirm();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (previewOpen) { exitPreviewMode(); return; }
    closeSlotMenu(); cancelConnection(); cancelGroupLabelEditor(); cancelProjectCatalogEditor(); closeProjectPicker(); cancelRoleCatalogEditor(); closeRolePicker(); cancelAreaCatalogEditor(); closeAreaPicker(); cancelMapSaveDialog(); closeMapLoadPicker(); cancelDeleteConfirm();
  }
});

// ─── INIT ───────────────────────────────────────────────────────────────────

resetView();
</script>
